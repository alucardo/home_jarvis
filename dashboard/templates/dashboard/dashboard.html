{% extends 'base.html' %}

{% block content %}
<main class="container mx-auto px-6 py-8">
    {% if running_entry %}
    <p>Obecny timer: {{ running_entry.category.name }} - Start: {{ running_entry.started_at|time:"H:i" }}</p>
    <form method="post" action="{% url 'time_manager:timer_stop' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-ghost btn-sm">Zatrzymaj timer</button>
    </form>
    {% else %}
    <form method="post" action="{% url 'time_manager:timer_start' %}" class="max-w-md">
        {% csrf_token %}
        <label class="label" for="{{ timer_form.category.id_for_label }}">
            <span class="label-text">{{ timer_form.category.label }}</span>
        </label>
        {{ timer_form.category }}
        <button type="submit" class="btn btn-primary mt-4">Start</button>
    </form>
    {% endif %}
</main>


{% endblock %}
