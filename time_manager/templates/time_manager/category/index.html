{% extends 'base.html' %}

{% block content %}
<main class="container mx-auto px-6 py-8">
    <div class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
            <h1 class="text-2xl font-bold">Kategorie</h1>
        </div>
        <div class="flex gap-2">
            <a href="{% url 'time_manager:category_create' %}" class="btn btn-primary btn-sm">Dodaj kategorię</a>
        </div>
    </div>

    <div class="overflow-x-auto">
        <table class="table table-sm">
            <thead>
            <tr>
                <th>Nazwa</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            {% for category in categories %}
            <tr>
                <td>{{ category.name }}</td>
                <td>
                    <form method="post"
                          action="{% url 'time_manager:category_delete' category.pk %}"
                          onsubmit="return confirm('Usunąć kategorię i wszystkie wpisy?')">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-ghost btn-xs text-error">
                            <i class="fa-solid fa-trash"></i> Usuń
                        </button>
                    </form>
                </td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</main>
{% endblock %}
