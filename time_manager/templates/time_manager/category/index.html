{% extends 'base.html' %}

{% block content %}
     <main class="container mx-auto px-6 py-8">
        <div class="flex items-center gap-4 mb-2">
            <h1 class="text-2xl font-bold">Kategorie</h1>
        </div>
        <div class="overflow-x-auto">
            <table class="table table-sm">
                <thead>
                    <tr>
                        <th>Nazwa</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    {% for category in categories %}
                        <tr>
                            <td>{{ category.name }}</td>
                            <td></td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
     </main>
{% endblock %}
