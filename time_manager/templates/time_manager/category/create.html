{% extends 'base.html' %}

{% block content %}
<main class="container mx-auto px-6 py-8">
    <div class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
            <h1 class="text-2xl font-bold">Dodaj kategorię</h1>
        </div>
        <div class="flex gap-2">
            <a href="{% url 'time_manager:category_index' %}" class="btn btn-primary btn-sm">Powrót do listy</a>
        </div>
    </div>
    <div>
        <form method="post" class="max-w-md">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-control mb-4">
                <label class="label" for="{{ field.id_for_label }}">
                    <span class="label-text">{{ field.label }}</span>
                </label>
                {{ field }}
                {% for error in field.errors %}
                <span class="text-error text-sm mt-1">{{ error }}</span>
                {% endfor %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Zapisz</button>
            <a href="{% url 'time_manager:category_index' %}" class="btn btn-ghost">Anuluj</a>
        </form>
    </div>
</main>
{% endblock %}
