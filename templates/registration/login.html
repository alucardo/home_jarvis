{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-base-200 flex items-center justify-center">
    <div class="card w-full max-w-sm bg-base-100 shadow-xl">
        <div class="card-body">
            <h1 class="text-2xl font-bold text-center mb-4">JARVIS v0.0.1</h1>

            {% if form.errors %}
            <div class="alert alert-error mb-4">
                <span>Nieprawidłowy email lub hasło.</span>
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-control mb-3">
                    <label class="label">
                        <span class="label-text">E-mail</span>
                    </label>
                    <input type="text" name="username" class="input input-bordered w-full" autofocus>
                </div>
                <div class="form-control mb-6">
                    <label class="label">
                        <span class="label-text">Hasło</span>
                    </label>
                    <input type="password" name="password" class="input input-bordered w-full">
                </div>
                <button type="submit" class="btn btn-primary w-full">Zaloguj</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
