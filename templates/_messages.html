{% if messages %}
<div class="container mx-auto px-6 py-8">
    <div class="flex flex-col gap-2 mb-4">
        {% for message in messages %}
        <div class="alert {{ message.level_tag }} py-2">
            <span>{{ message }}</span>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
